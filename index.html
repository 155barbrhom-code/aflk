<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>متتبع التحدي اليومي</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f7d6b"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--tx:#23312c;--mut:#7a857f;--ac:#2f7d6b;--ac2:#e3f0eb;--ok:#2e9d5f;--bad:#d4574a;--line:#e5dfd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b19;--card:#1e2926;--tx:#e8efec;--mut:#8fa09a;--ac:#4fbfa4;--ac2:#25382f;--ok:#4fcf86;--bad:#f0786a;--line:#2e3d38}}
:root[data-theme="dark"]{--bg:#141b19;--card:#1e2926;--tx:#e8efec;--mut:#8fa09a;--ac:#4fbfa4;--ac2:#25382f;--ok:#4fcf86;--bad:#f0786a;--line:#2e3d38}
html,body{height:auto}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",Tahoma,system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:14px}
h1{font-size:22px;margin:4px 0}h3{margin:0;flex:1;font-size:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 8px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #0000000a}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:12px;border:1px solid var(--line);background:var(--t,var(--card))}
.day small{font-size:11px;color:var(--mut)}.day b{font-size:18px}.day i{font-size:12px;font-style:normal;color:var(--mut)}
.day.on{outline:3px solid var(--ac)}.day.td{border:2px dashed var(--ac)}.day:disabled{opacity:.35;cursor:default}
.big{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score{font-size:38px;font-weight:800;color:var(--ac)}
.bar{height:10px;background:var(--ac2);border-radius:9px;overflow:hidden;margin:8px 0;flex:1;min-width:120px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.up{color:var(--ok)}.dn{color:var(--bad)}.eq{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.tg{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:right}
.tg.on{background:var(--ac2);border-color:var(--ac)}.tg .c{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);display:grid;place-items:center;color:#fff;flex:none}
.tg.on .c{background:var(--ac);border-color:var(--ac)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}.mood{font-size:26px;padding:4px 10px}
label{display:block;font-weight:600;margin:12px 0 6px}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;flex:1;width:100%}
.row{display:flex;align-items:center;gap:8px}.bt{background:var(--ac);color:#fff;padding:10px 16px;border-radius:12px;flex:none}
.gh{color:var(--mut);padding:4px 8px}.mut{color:var(--mut)}
.tk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.tk span{flex:1}.tk.dn span{text-decoration:line-through;color:var(--mut)}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);color:#fff;flex:none}.dn .ck{background:var(--ac);border-color:var(--ac)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.st b{display:block;font-size:22px;color:var(--ac)}.st small{color:var(--mut)}
.ch{display:flex;gap:2px;align-items:flex-end;height:170px;direction:rtl}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.col .b{width:70%;border-radius:5px 5px 0 0;background:var(--ac)}.col s{text-decoration:none;font-size:12px;line-height:1.2}.col small{font-size:9px;color:var(--mut)}
.tr{display:flex;align-items:center;gap:8px;margin:8px 0}.tr .nm{width:46%;font-size:14px}.tr .bar{margin:0}.tr em{font-style:normal;font-size:13px;width:92px;text-align:left;color:var(--mut)}
.tk.dn{color:inherit}.hg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px auto 0;max-width:520px;text-align:center}.hm{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);font-size:14px}.hi .bar i{background:var(--ok)}.lo .bar i{background:var(--bad)}
</style></head><body><main id="app"></main>
<script>
/*L*/
const B=['أداء تمارين رياضية','دراسة','أداء الصلوات','قراءة القرآن','ممارسة التحدث','شرب لترين ونصف ماء وفوق','تناول طعام صحي','تمارين التنفس','مشاهدة حلقة علاج الإدمان','النظافة الشخصية','ترفيه عن نفسك (مشاهدة شيء أو غيره)','تعلم مهارة بسيطة'];
const IC=['🏋️','📚','🕌','📖','🗣️','💧','🥗','🌬️','🎧','🚿','🎬','💡'],SL=['3-5 ساعات','6 ساعات','7-8 ساعات','8+ ساعات'],SV=[4,6,7.5,9],MD=['😞','😕','😐','🙂','😄'];
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let S={days:{},skills:[],cfg:{n:{},x:[],h:[]}},T=B.slice();
function cfg(){const c=S.cfg=S.cfg||{};c.n=c.n||{};c.x=c.x||[];c.h=c.h||[];if(!S.start){const ks=Object.keys(S.days).sort();S.start=ks[0]||today()}T=B.map((t,i)=>c.n[i]||t).concat(c.x)}
const AC=()=>T.map((_,i)=>i).filter(i=>!S.cfg.h.includes(i)),N=()=>AC().length||1;
const pad=n=>String(n).padStart(2,'0'),dk=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const today=()=>{const n=new Date();return dk(n.getFullYear(),n.getMonth(),n.getDate())},cm=()=>cyc(today());
const dim=()=>30,wd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).getDay()};
function addDays(k,n){const[y,m,d]=k.split('-').map(Number),x=new Date(y,m-1,d+n);return dk(x.getFullYear(),x.getMonth(),x.getDate())}
function cyc(k){const[a,b,c]=S.start.split('-').map(Number),[y,m,d]=k.split('-').map(Number),df=Math.round((new Date(y,m-1,d)-new Date(a,b-1,c))/864e5);return addDays(S.start,Math.floor(df/30)*30)}
const score=r=>r?r.t.filter(i=>!S.cfg.h.includes(i)).length:0,f=x=>x==null?'—':String(Math.round(x*10)/10);
const sd=k=>(+k.slice(8))+' '+MN[+k.slice(5,7)-1],mn=ym=>sd(ym)+' – '+sd(addDays(ym,29));
function prevL(k){let b=null;for(const x of Object.keys(S.days))if(x<k&&(!b||x>b))b=x;return b?{k:b,s:score(S.days[b])}:null}
function months(){const s=new Set(Object.keys(S.days).map(k=>cyc(k)));s.add(cm());return[...s].sort()}
function st(ym){const ks=Object.keys(S.days).filter(k=>k>=ym&&k<=addDays(ym,29)).sort(),n=ks.length,cnt=T.map(()=>0),a={sl:[],md:[],st:[],sc:[]};let tot=0,best=null,worst=null;
 ks.forEach(k=>{const r=S.days[k],s=score(r);tot+=s;r.t.forEach(i=>cnt[i]++);if(!best||s>best.s)best={k,s};if(!worst||s<worst.s)worst={k,s};
  if(r.sl!=null)a.sl.push(SV[r.sl]);if(r.md!=null)a.md.push(r.md+1);if(r.st!=null)a.st.push(r.st);if(r.sc!=null)a.sc.push(r.sc)});
 const av=x=>x.length?x.reduce((p,c)=>p+c,0)/x.length:null;
 return{ks,n,cnt,avg:n?tot/n:0,pct:n?tot/(n*N())*100:0,best,worst,sl:av(a.sl),md:av(a.md),st:av(a.st),sc:av(a.sc)}}
function streak(){const d=new Date();let c=0,first=true;for(;;){const k=dk(d.getFullYear(),d.getMonth(),d.getDate()),r=S.days[k];if(r&&score(r)*2>=N())c++;else if(!first)break;first=false;d.setDate(d.getDate()-1)}return c}
function grp(fl,len){const g=Array.from({length:len},()=>({n:0,t:0}));Object.values(S.days).forEach(r=>{if(r[fl]!=null&&g[r[fl]]){g[r[fl]].n++;g[r[fl]].t+=score(r)}});return g}
const pm=ym=>addDays(ym,-30);
/*E*/
try{const x=JSON.parse(localStorage.getItem('dt1')||'null');if(x&&x.days)S={days:x.days,skills:x.skills||[],cfg:x.cfg,start:x.start}}catch(e){}cfg();
const save=()=>{try{localStorage.setItem('dt1',JSON.stringify(S))}catch(e){}};
const rec=k=>S.days[k]||(S.days[k]={t:[],sl:null,md:null,st:null,sc:null});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ui={page:'t',vm:cm(),sel:today(),cd:null,day:today()};
const arrow=(p,s)=>s>p?['↑','up']:s<p?['↓','dn']:['➜','eq'];
const dname=k=>{const[y,m,d]=k.split('-').map(Number);return WD[new Date(y,m-1,d).getDay()]+' '+d+' '+MN[m-1]};
function setVM(v){ui.vm=v;ui.sel=v===cm()?today():addDays(v,29)}
function pT(){
 const n=30,td=today();let s='<div class="card"><div class="strip">';
 for(let d=1;d<=n;d++){const k=addDays(ui.vm,d-1),r=S.days[k],sc=score(r);
  s+=`<button class="day${k===ui.sel?' on':''}${k===td?' td':''}" ${k>td?'disabled':''} data-a="sel" data-k="${k}" style="${r?'--t:hsl('+(sc/N()*130)+' 55% 50%/.28)':''}"><small>${WD[wd(k)]}</small><b>${d}</b><i>${r?sc+'/'+N():'·'}</i></button>`}
 s+='</div></div>';
 const k=ui.sel,r=S.days[k]||{t:[],sl:null,md:null,st:null,sc:null},sc=score(r),p=prevL(k),a=p?arrow(p.s,sc):null;
 s+=`<div class="card"><div class="big"><div><div class="mut">${dname(k)}${k===td?' (اليوم)':''}</div><div class="score">${sc}/${N()}</div></div><div style="flex:1;min-width:150px"><div class="bar"><i style="width:${sc/N()*100}%"></i></div>${a?`<b class="${a[1]}">${a[0]}</b> <span class="mut">مقارنة بآخر يوم مسجّل (${p.s}/${N()})</span>`:'<span class="mut">أول يوم مسجّل</span>'}</div></div></div>`;
 s+='<div class="card"><div class="grid">'+AC().map(i=>`<button class="tg${r.t.includes(i)?' on':''}" data-a="tog" data-i="${i}"><span class="c">${r.t.includes(i)?'✓':''}</span><span>${IC[i]||'⭐'} ${T[i]}</span></button>`).join('')+'</div><button class="gh" data-a="edt">⚙️ تعديل المهام</button>';
 s+='<label>😴 كم ساعة نمت؟</label><div class="chips">'+SL.map((t,i)=>`<button class="chip${r.sl===i?' on':''}" data-a="sl" data-i="${i}">${t}</button>`).join('')+'</div>';
 s+='<label>مزاجك اليوم</label><div class="chips">'+MD.map((t,i)=>`<button class="chip mood${r.md===i?' on':''}" data-a="md" data-i="${i}">${t}</button>`).join('')+'</div>';
 s+=`<div class="grid"><div><label>📚 ساعات الدراسة</label><input type="number" min="0" max="24" step="0.5" inputmode="decimal" data-f="st" value="${r.st==null?'':r.st}"></div><div><label>📱 Screen time (ساعات الجلوس على الجوال)</label><input type="number" min="0" max="24" step="0.5" inputmode="decimal" data-f="sc" value="${r.sc==null?'':r.sc}"></div></div><label>📝 ملاحظة اليوم (اختياري)</label><input data-f="nt" value="${esc(r.nt||'')}" placeholder="وش صار اليوم؟"></div>${ui.edit?ep():''}`;
 return s}
function pS(){
 let s='<div class="card"><b>➕ مهارة جديدة</b><div class="row" style="margin-top:8px"><input id="ns" data-en="addSkill" placeholder="اسم المهارة، مثال: الإنجليزية"><button class="bt" data-a="addSkill">إضافة</button></div></div>';
 if(!S.skills.length)s+='<p class="mut" style="text-align:center">ما أضفت مهارات بعد. أضف مهارة ثم اكتب تحتها مهامها.</p>';
 S.skills.forEach(k=>{const d=k.tasks.filter(t=>t.d).length,l=k.tasks.length;
  s+=`<div class="card"><div class="row"><h3>🧠 ${esc(k.name)}</h3><span class="mut">${d}/${l}</span><button class="gh" data-a="delSkill" data-id="${k.id}">${ui.cd===k.id?'تأكيد الحذف؟':'🗑️'}</button></div><div class="bar"><i style="width:${l?d/l*100:0}%"></i></div>`+
  k.tasks.map(t=>`<div class="tk${t.d?' dn':''}"><button class="ck" data-a="togTask" data-id="${k.id}" data-t="${t.id}">${t.d?'✓':''}</button><span>${esc(t.t)}</span><button class="gh" data-a="delTask" data-id="${k.id}" data-t="${t.id}">✕</button></div>`).join('')+
  `<div class="row" style="margin-top:10px"><input id="nt${k.id}" data-en="addTask" data-id="${k.id}" placeholder="أضف مهمة لهذه المهارة"><button class="bt" data-a="addTask" data-id="${k.id}">＋</button></div></div>`});
 return s}
function ep(){return `<div class="card"><b>⚙️ تعديل المهام</b>`+AC().map(i=>`<div class="row" style="margin-top:8px"><input data-f="rn" data-i="${i}" value="${esc(T[i])}"><button class="gh" data-a="hide" data-i="${i}">✕</button></div>`).join('')+`<div class="row" style="margin-top:8px"><input id="nx" data-en="addX" placeholder="مهمة جديدة"><button class="bt" data-a="addX">إضافة</button></div>`+(S.cfg.h.length?'<p class="mut">محذوفة (اضغط للاسترجاع):</p><div class="chips">'+S.cfg.h.map(i=>`<button class="chip" data-a="show" data-i="${i}">${esc(T[i])}</button>`).join('')+'</div>':'')+'<p class="mut">المهمة المحذوفة تختفي من الحساب وتبقى بياناتها القديمة محفوظة.</p></div>'}
function pX(){let s='';const o=st(ui.vm),pv=st(pm(ui.vm));
 if(o.n&&pv.n){const d=o.pct-pv.pct,a=d>.5?['↑','up','أفضل']:d<-.5?['↓','dn','أقل']:['➜','eq','ثابت'];s+=`<div class="card"><b>🆚 مقارنة بـ ${mn(pm(ui.vm))}</b><p><b class="${a[1]}">${a[0]}</b> أداؤك ${a[2]}${a[1]==='eq'?'':' بـ '+f(Math.abs(d))+'%'} (${f(o.pct)}% مقابل ${f(pv.pct)}%)</p></div>`}
 if(o.n){const off=(wd(ui.vm)+2)%7;let h=['جمع','سبت','أحد','اثن','ثلا','أرب','خمي'].map(x=>`<small class="mut">${x}</small>`).join('')+'<i></i>'.repeat(off);
  for(let d=1;d<=30;d++){const r=S.days[addDays(ui.vm,d-1)];h+=`<div class="hm" style="${r?'background:hsl('+(score(r)/N()*130)+' 55% 50%/.55)':''}">${d}</div>`}
  s+=`<div class="card"><b>🗓️ خريطة الشهر</b><div class="hg">${h}</div></div>`}
 if(Object.keys(S.days).length>=3){const gs=grp('sl',4),gm=grp('md',5),row=(g,lab)=>g.map((x,i)=>x.n?`<div class="tr"><span class="nm">${lab(i)}</span><div class="bar"><i style="width:${x.t/x.n/N()*100}%"></i></div><em>${f(x.t/x.n)}/${N()} (${x.n} يوم)</em></div>`:'').join('');
  const bs=gs.map((x,i)=>({i,a:x.n?x.t/x.n:-1})).sort((p,q)=>q.a-p.a)[0];
  s+=`<div class="card"><b>🔍 وش يأثر على أدائك؟</b><p class="mut">متوسط مهامك حسب النوم والمزاج (كل الأيام المسجّلة)</p>${bs.a>=0?'<p>⭐ أحسن أداء عندك لما تنام <b>'+SL[bs.i]+'</b></p>':''}<b>😴 النوم</b>${row(gs,i=>SL[i])}<b>🙂 المزاج</b>${row(gm,i=>MD[i])}</div>`}
 const nk=o.ks.filter(k=>S.days[k].nt);if(nk.length)s+=`<div class="card"><b>📝 ملاحظات الشهر</b>`+nk.map(k=>`<p><b>${dname(k)}</b><br>${esc(S.days[k].nt)}</p>`).join('')+'</div>';
 s+=`<div class="card"><b>💾 نسخة احتياطية</b><p class="mut">اضغط إنشاء، ثم انسخ النص واحفظه في ملاحظات هاتفك. للاسترجاع الصق النص هنا واضغط استرجاع.</p>${ui.msg?`<p><b>${ui.msg}</b></p>`:''}<textarea id="bk" rows="4" style="width:100%;border-radius:12px;padding:10px;background:var(--bg);color:inherit;border:1px solid var(--line)">${esc(ui.bk||'')}</textarea><div class="row" style="margin-top:8px"><button class="bt" data-a="bk">إنشاء النسخة</button><button class="bt" data-a="rs">استرجاع</button></div></div>`;
 return s}
function pSt(){return pSt0()+pX()}
function pSt0(){
 const o=st(ui.vm);let s='<div class="chips">'+months().map(x=>`<button class="chip${x===ui.vm?' on':''}" data-a="vm" data-k="${x}">${mn(x)}</button>`).join('')+'</div>';
 if(!o.n)return s+'<div class="card"><p class="mut">ما في أيام مسجّلة في '+mn(ui.vm)+'.</p></div>';
 const dl=k=>(+k.slice(8))+' '+MN[+k.slice(5,7)-1];
 s+=`<div class="card"><div class="cards"><div class="st"><b>${f(o.avg)}/${N()}</b><small>متوسط المهام اليومي</small></div><div class="st"><b>${f(o.pct)}%</b><small>نسبة الأداء الكلية</small></div><div class="st"><b>${o.n}</b><small>أيام مسجّلة</small></div><div class="st"><b>${o.best.s}/${N()}</b><small>أفضل يوم: ${dl(o.best.k)}</small></div><div class="st"><b>${o.worst.s}/${N()}</b><small>أضعف يوم: ${dl(o.worst.k)}</small></div><div class="st"><b>${f(o.sl)}</b><small>متوسط النوم (ساعة)</small></div><div class="st"><b>${f(o.st)}</b><small>متوسط الدراسة (ساعة)</small></div><div class="st"><b>${f(o.sc)}</b><small>متوسط Screen time</small></div><div class="st"><b>${o.md==null?'—':MD[Math.round(o.md)-1]}</b><small>متوسط المزاج</small></div></div></div>`;
 const sc=o.ks.map(k=>score(S.days[k])),h=Math.floor(sc.length/2),av=x=>x.reduce((p,c)=>p+c,0)/x.length;
 let tr='<span class="mut">سجّل يومين على الأقل لتظهر المقارنة</span>';
 if(h>=1){const d=av(sc.slice(h))-av(sc.slice(0,h));tr=Math.abs(d)<.5?'<b class="eq">➜ ثابت</b> — أداؤك مستقر بين النصف الأول والثاني':d>0?'<b class="up">↑ صاعد</b> — النصف الثاني أفضل بـ '+f(d)+' مهمة يومياً':'<b class="dn">↓ نازل</b> — النصف الثاني أقل بـ '+f(-d)+' مهمة يومياً'}
 let c='';
 for(let d=1;d<=30;d++){const k=addDays(ui.vm,d-1),r=S.days[k];let ar='';
  if(r){const p=prevL(k);if(p){const a=arrow(p.s,score(r));ar=`<s class="${a[1]}">${a[0]}</s>`}}
  c+=`<div class="col">${r?`<small>${score(r)}</small><div class="b" style="height:${score(r)/N()*100*.75}%"></div>`:''}${ar||'<s> </s>'}<small>${d}</small></div>`}
 s+=`<div class="card"><b>📈 مخطط النقاط اليومي</b><p>${tr}</p><div class="ch">${c}</div></div>`;
 const A=AC(),cs=A.map(i=>o.cnt[i]),mx=Math.max(...cs),mi=Math.min(...cs),im=A[cs.indexOf(mx)],il=A[cs.indexOf(mi)];
 s+=`<div class="card"><b>✅ أداء كل مهمة</b><p class="mut">🏆 الأكثر التزاماً: ${T[im]} (${f(mx/o.n*100)}%)${mx!==mi?'<br>⚠️ الأقل التزاماً: '+T[il]+' ('+f(mi/o.n*100)+'%)':''}</p>`+
 A.map(i=>`<div class="tr${mx!==mi&&i===im?' hi':''}${mx!==mi&&i===il?' lo':''}"><span class="nm">${IC[i]||'⭐'} ${T[i]}</span><div class="bar"><i style="width:${o.cnt[i]/o.n*100}%"></i></div><em>${o.cnt[i]}/${o.n} · ${f(o.cnt[i]/o.n*100)}%</em></div>`).join('')+'</div>';
 return s}
function render(){
 if(ui.day!==today()){const w=ui.vm===cyc(ui.day);ui.day=today();if(w)setVM(cm())}
 const L=months(),i=L.indexOf(ui.vm);
 document.getElementById('app').innerHTML=`<div class="top"><h1>🎯 متتبع التحدي اليومي</h1><div class="nav">🔥 <b>${streak()}</b> يوم متتالي</div><div class="nav"><button class="gh" data-a="pm" ${i<=0?'disabled':''}>▶</button><b>${mn(ui.vm)}</b><button class="gh" data-a="nm" ${i>=L.length-1?'disabled':''}>◀</button></div></div><div class="tabs">${[['t','📋 المهام'],['s','🧠 المهارات'],['x','📊 الإحصائيات']].map(x=>`<button class="tab${ui.page===x[0]?' on':''}" data-a="pg" data-p="${x[0]}">${x[1]}</button>`).join('')}</div>`+(ui.page==='t'?pT():ui.page==='s'?pS():pSt())}
function act(a,el){const D=el.dataset;if(a!=='delSkill')ui.cd=null;ui.msg='';
 if(a==='pg')ui.page=D.p;
 else if(a==='pm'||a==='nm'){const L=months(),i=L.indexOf(ui.vm)+(a==='nm'?1:-1);if(L[i])setVM(L[i])}
 else if(a==='vm')setVM(D.k);
 else if(a==='edt')ui.edit=!ui.edit;
 else if(a==='hide'){if(N()>1){S.cfg.h.push(+D.i);save()}}
 else if(a==='show'){S.cfg.h=S.cfg.h.filter(x=>x!==+D.i);save()}
 else if(a==='addX'){const v=document.getElementById('nx').value.trim();if(v){S.cfg.x.push(v);cfg();save()}}
 else if(a==='bk'){ui.bk=JSON.stringify(S);ui.msg='تم إنشاء النسخة، انسخ النص من الأسفل'}
 else if(a==='rs'){try{const x=JSON.parse(document.getElementById('bk').value);if(!x||typeof x.days!=='object')throw 0;S={days:x.days,skills:x.skills||[],cfg:x.cfg,start:x.start};cfg();save();setVM(cm());ui.msg='تم الاسترجاع ✅'}catch(e){ui.msg='النص غير صحيح'}}
 else if(a==='sel')ui.sel=D.k;
 else if(a==='tog'){const r=rec(ui.sel),i=+D.i,j=r.t.indexOf(i);j<0?r.t.push(i):r.t.splice(j,1);save()}
 else if(a==='sl'){const r=rec(ui.sel);r.sl=r.sl===+D.i?null:+D.i;save()}
 else if(a==='md'){const r=rec(ui.sel);r.md=r.md===+D.i?null:+D.i;save()}
 else if(a==='addSkill'){const v=document.getElementById('ns').value.trim();if(v){S.skills.push({id:uid(),name:v,tasks:[]});save()}}
 else if(a==='delSkill'){if(ui.cd===D.id){S.skills=S.skills.filter(k=>k.id!==D.id);ui.cd=null;save()}else ui.cd=D.id}
 else if(a==='addTask'){const v=document.getElementById('nt'+D.id).value.trim(),k=S.skills.find(x=>x.id===D.id);if(v&&k){k.tasks.push({id:uid(),t:v,d:0});save()}}
 else if(a==='togTask'){const t=S.skills.find(x=>x.id===D.id).tasks.find(x=>x.id===D.t);t.d=t.d?0:1;save()}
 else if(a==='delTask'){const k=S.skills.find(x=>x.id===D.id);k.tasks=k.tasks.filter(x=>x.id!==D.t);save()}
 render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.en)act(e.target.dataset.en,e.target)});
document.addEventListener('change',e=>{const fl=e.target.dataset.f;if(!fl)return;const v=e.target.value.trim();
 if(fl==='rn'){const i=+e.target.dataset.i;if(v){if(i<B.length)S.cfg.n[i]=v;else S.cfg.x[i-B.length]=v;cfg()}}
 else if(fl==='nt')rec(ui.sel).nt=v||null;
 else rec(ui.sel)[fl]=v===''?null:Math.max(0,Math.min(24,+v));
 save();render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
